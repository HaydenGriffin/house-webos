<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920,height=1080,user-scalable=no">
<title>House</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="house" aria-busy="true">
  <header class="top">
    <div class="title">
      <h1 id="title">House</h1>
      <p id="date"></p>
    </div>
    <div class="glance">
      <span id="chips"></span>
      <p id="door" class="chip open" hidden><span class="disc" data-icon="doorOpen"></span><span>Door open</span></p>
      <time id="clock"></time>
    </div>
    <p id="next" class="next" hidden><span id="event"></span><span id="status"></span></p>
  </header>

  <p id="banner" role="status" hidden></p>

  <div class="layout">
    <section class="lights" aria-labelledby="lights-h">
      <h2 id="lights-h">Lights</h2>
      <div class="rooms" id="rooms"></div>
    </section>

    <div class="side">
      <section class="tv" id="tv" aria-labelledby="tv-h" hidden>
        <div class="head"><h2 id="tv-h">TV</h2><p id="tv-line" class="sub"></p></div>
        <div class="segments" id="sources" role="group" aria-label="TV source"></div>
        <div id="tv-wide"></div>
      </section>

      <section class="music" id="music" aria-labelledby="music-h" hidden>
        <h2 id="music-h">Speakers</h2>
        <div class="now">
          <p id="track" class="track">Nothing playing</p>
          <p id="artist" class="sub"></p>
        </div>
        <div class="transport">
          <button class="round" id="play" data-act="music_toggle" aria-label="Play"><span class="ico" data-icon="play"></span></button>
          <button class="round" data-act="music_next" aria-label="Next track"><span class="ico" data-icon="skipNext"></span></button>
        </div>
        <div id="music-toggle"></div>
      </section>
    </div>
  </div>

  <footer class="bottom">
    <button class="pill" id="close"><span class="ico" data-icon="arrowLeft"></span>Back to TV</button>
    <button class="pill" id="week" hidden><span class="ico" data-icon="calendarWeek"></span>This week</button>
    <span id="footer-actions"></span>
    <span id="people"></span>
  </footer>
  <p id="idle" class="sub" hidden></p>

  <p id="toast" role="status" aria-live="polite" hidden></p>
</main>

<section id="recap" aria-label="Your week at home" hidden>
  <div class="r-bars" aria-hidden="true"></div>
  <div class="r-top"><p>Your week at home</p><p class="r-hint"></p></div>
  <div class="r-stage" aria-live="polite"></div>
</section>
<script src="config.js"></script>
<script src="theme.js"></script>
<script src="icons.js"></script>
<script src="demo.js"></script>
<script src="glance.js"></script>
<script src="recap.js"></script>
<script src="app.js"></script>
</body>
</html>
