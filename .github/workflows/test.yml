name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Python tests
        run: python3 -m unittest discover -s tests
      - name: Node tests
        run: node --test
      - name: ESLint (ES5, app/)
        run: npx --yes eslint@9 --max-warnings 0 app
